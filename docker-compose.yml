version: '3.8'

services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-redaezziani/l9dam}:latest
    container_name: l9dam
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'

    env_file:
      - .env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
